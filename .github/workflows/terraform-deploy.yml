name: Terraform Deployment - Cross Region OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================
  # DEVELOPMENT PLAN
  # ==========================================

  plan-dev:
    name: Terraform Plan - Development
    runs-on: ubuntu-latest
    environment: development

    env:
      AWS_REGION: us-east-1
      WORKSPACE_NAME: development

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials - OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::932316879518:role/GitHubTerraformDevelopment
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Workspace
        run: |
          terraform workspace select "$WORKSPACE_NAME" || terraform workspace new "$WORKSPACE_NAME"

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="aws_region=$AWS_REGION" \
            -out=tfplan

      - name: Upload Dev Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: tfplan


  # ==========================================
  # DEVELOPMENT APPLY
  # ==========================================

  apply-dev:
    name: Terraform Apply - Development
    runs-on: ubuntu-latest
    needs: plan-dev
    environment: development

    env:
      AWS_REGION: us-east-1
      WORKSPACE_NAME: development

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials - OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::932316879518:role/GitHubTerraformDevelopment
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Workspace
        run: |
          terraform workspace select "$WORKSPACE_NAME" || terraform workspace new "$WORKSPACE_NAME"

      - name: Download Dev Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan


  # ==========================================
  # PRODUCTION PLAN
  # ==========================================

  plan-prod:
    name: Terraform Plan - Production
    runs-on: ubuntu-latest
    needs: apply-dev
    environment: production

    env:
      AWS_REGION: us-west-2
      WORKSPACE_NAME: production

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials - OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::932316879518:role/GitHubTerraformProduction
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Workspace
        run: |
          terraform workspace select "$WORKSPACE_NAME" || terraform workspace new "$WORKSPACE_NAME"

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="aws_region=$AWS_REGION" \
            -out=tfplan

      - name: Upload Prod Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: tfplan


  # ==========================================
  # PRODUCTION APPLY
  # ==========================================

  apply-prod:
    name: Terraform Apply - Production
    runs-on: ubuntu-latest
    needs: plan-prod
    environment: production

    env:
      AWS_REGION: us-west-2
      WORKSPACE_NAME: production

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials - OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::932316879518:role/GitHubTerraformProduction
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Workspace
        run: |
          terraform workspace select "$WORKSPACE_NAME" || terraform workspace new "$WORKSPACE_NAME"

      - name: Download Prod Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
